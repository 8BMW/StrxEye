[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strxeye"
version = "0.1.0"
description = "Local-first OSINT investigation framework: passive domain, IP and certificate collection with an evidence graph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "STRX EYE contributors" }]
keywords = ["osint", "threat-intelligence", "dns", "rdap", "certificate-transparency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "dnspython>=2.6",
  "cryptography>=42",
  "idna>=3.7",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
strxeye = "strxeye.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/strxeye"]
# The built web UI is generated (and git-ignored) but must ship in wheels.
artifacts = ["src/strxeye/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real public services; run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
