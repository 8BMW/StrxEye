name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems should be reported privately, see SECURITY.md.
        Please remove any investigation data you are not allowed to share.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or UI steps, and the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `strxeye --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with --json (if relevant)
      render: json
