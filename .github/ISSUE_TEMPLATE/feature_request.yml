name: Feature or data source request
description: Suggest a collector, analysis or UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Investigation problem
      description: What are you trying to find out, and why can't you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For new sources, link the API documentation and terms of use, and say whether a key is required.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not involve locating private individuals, collecting personal contact data, or bypassing access controls.
          required: true
