name: Release

# Push a tag like v1.2.3 to build and publish a release. The tag must match
# the version in pyproject.toml, or the build stops.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run bundle
      - run: pip install ".[desktop]" pyinstaller pillow
      - run: pyinstaller packaging/strxeye.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Smoke-test the built executables
        shell: pwsh
        run: |
          & "build/dist/STRX EYE/strxeye.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI failed" }
          $p = Start-Process -FilePath "build/dist/STRX EYE/STRX EYE.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "desktop self-test failed with $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=$env:VERSION" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "build/dist/STRX EYE" -DestinationPath "build/installer/STRX-EYE-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/installer/*
          if-no-files-found: error

  unix:
    name: ${{ matrix.label }} build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run bundle
      # Linux builds skip pywebview (it needs GTK or Qt at runtime); the app
      # then opens the UI in the default browser instead.
      - run: pip install ".[server]" pyinstaller pillow
      - if: runner.os == 'macOS'
        run: pip install "pywebview>=5.3"
      - run: pyinstaller packaging/strxeye.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Smoke-test
        run: |
          "build/dist/STRX EYE/strxeye" --version
          "build/dist/STRX EYE/STRX EYE" --self-test
      - name: Archive
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p out
          tar -C build/dist -czf "out/STRX-EYE-$VERSION-${{ matrix.label }}.tar.gz" "STRX EYE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run bundle
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, unix, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          printf '\n---\nVerify downloads with `sha256sum -c SHA256SUMS.txt` (Linux/macOS) or `Get-FileHash` (Windows).\nThe Windows installer is not code-signed yet, so SmartScreen may warn on first run.\n' >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "STRX EYE ${GITHUB_REF_NAME#v}" --notes-file notes.md
